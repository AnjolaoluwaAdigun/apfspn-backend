                        type: string
                        example: create_password
                      password_token:
                        type: string
                        example: '{password_token}'
        422:
          description: 'Failure (Unprocessable Content)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'The code you entered is incorrect.'
                  data:
                    code: invalid_otp
                    attempts_remaining: 4
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'The code you entered is incorrect.'
