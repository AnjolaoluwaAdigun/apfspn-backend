openapi: 3.0.3
info:
  title: 'APFSPN API'
  description: 'REST API for the APFSPN public website, member portal and admin dashboard.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Public
    description: ''
  -
    name: 'Admin Auth'
    description: ''
  -
    name: 'Admin Dashboard'
    description: 'The admin landing page. Needs an admin access token (admin_token) with dashboard.view. Each section is included only when the admin holds its permission; sections are cached for 60 seconds and cleared when members, events, articles or audit rows change.'
  -
    name: 'Admin Members'
    description: 'Member management for admins. Every request needs an admin access token (admin_token) and the permission named in its description; without it the API returns 403. List and Pending save the first member to member_uuid, and Show saves the member it returns. {{member_uuid}} is the member (user) uuid, not the membership uuid.'
  -
    name: 'Admin Events'
    description: 'Event management for admins. Every request needs an admin access token (admin_token) and the permission named in its description. List, Create and Show save the event to event_uuid and event_slug. Attendees and Waitlist save the first registration to registration_uuid. Authors can create events and update only their own drafts; publishing needs events.publish and cancelling needs events.cancel.'
  -
    name: 'Admin Articles'
    description: 'News and press management. Every request needs an admin access token (admin_token) and the permission named in its description. List, Create and Show save the article to article_uuid and article_slug; Revisions saves the newest revision to revision_uuid. Workflow: draft -> submit -> in_review -> publish / schedule / send back. Authors (articles.submit, no articles.publish) can edit only their own draft or changes_requested articles. Repeating an action whose target state is already reached returns 200 unchanged. Refused transitions return 422 invalid_status_transition with current_status.'
  -
    name: 'Admin Users'
    description: 'Staff accounts. Super admin only by default. Saves admin_uuid from List, Invite and Show. Safety rules: you cannot disable, delete or change the role of yourself (cannot_modify_self); the last active super_admin cannot be disabled, deleted or demoted (last_super_admin); you cannot assign a role or manage an admin with permissions you do not hold (role_exceeds_own_permissions, 403).'
  -
    name: 'Admin Roles'
    description: 'Roles and permissions. Super admin only by default. Saves role_uuid from List (first editable role), Create and Show. The super_admin role is locked (role_locked). Built-in roles keep their names (built_in_role_name_locked) but their permissions can be edited, and the seeder never undoes those edits.'
  -
    name: 'Member Auth'
    description: ''
  -
    name: 'Member Dashboard'
    description: 'The member landing page. Needs a member access token (member_token).'
  -
    name: 'Member Registration'
    description: 'Phase 2. Register (pending_approval membership) -> Verify Email -> Create Password, which signs the member in. Registration documents are stored privately on Cloudinary; profile responses carry a short-lived signed `document_url` for the owner and admins only. Locally, `php artisan apfspn:member-verify-code {email}` prints a fresh code and challenge_token without sending email; paste them into otp_code and member_challenge_token.'
  -
    name: 'Member Events'
    description: 'Public event listing (no token) and member registration (member_token). Public List and Show save event_uuid and event_slug. Only members with an active membership can register; pending and expired members get 403 membership_not_active. virtual_link is never public: it is returned on the registration only while the member holds a seat.'
  -
    name: 'Public Articles'
    description: 'Public news and press pages. No token. Only published articles are visible; anything else is 404. Showing an article counts a view.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from `POST /api/v1/admin/auth/login` or `POST /api/v1/member/auth/login`. With the demo data seeded, admins sign in with `superadmin@apfspn.test` / `Password123!` and members with `adaobi@apfspn.test` / `Member123!`.'
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: 'App\ Http\ Controllers\ Health Controller'
      operationId: appHttpControllersHealthController
      description: ''
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'Service is healthy.'
                  data:
                    status: ok
                    app: Laravel
                    version: v1
                    time: '2026-10-16T14:26:40+00:00'
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Service is healthy.'
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      app:
                        type: string
                        example: Laravel
                      version:
                        type: string
                        example: v1
                      time:
                        type: string
                        example: '2026-10-16T14:26:40+00:00'
      tags:
        - Public
      security: []
  /api/v1/admin/auth/login:
    post:
      summary: Login
      operationId: login
      description: "**Rate limit:** `login`.\n\nReturns next_step `authenticated` with tokens and admin, or `verify_otp` with a challenge when APFSPN_ADMIN_TWO_FACTOR is on. Errors: invalid_credentials (401), account_disabled (403), must_reset_password (403)."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'Login successful.'
                  data:
                    next_step: authenticated
                    tokens:
                      access_token: '{access_token}'
                      refresh_token: '{refresh_token}'
                      token_type: Bearer
                      expires_in: 3600
                      refresh_expires_in: 2592000
                    admin:
                      uuid: 01a1451b-02d3-7338-8684-7ea8ba3bb976
                      name: 'Mrs. Freida Hettinger DVM'
                      email: rachel.wunsch@apfspn.test
                      status: active
                      account_state: active
                      must_reset_password: false
                      last_login_at: '2026-10-16T14:26:00+00:00'
                      roles:
                        - events_coordinator
                      permissions:
                        - dashboard.view
                        - event_registrations.export
                        - event_registrations.update
                      created_at: '2026-10-16T14:26:00+00:00'
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Login successful.'
                  data:
                    type: object
                    properties:
                      next_step:
                        type: string
                        example: authenticated
                      tokens:
                        type: object
                        properties:
                          access_token:
                            type: string
                            example: '{access_token}'
                          refresh_token:
                            type: string
                            example: '{refresh_token}'
                          token_type:
                            type: string
                            example: Bearer
                          expires_in:
                            type: integer
                            example: 3600
                          refresh_expires_in:
                            type: integer
                            example: 2592000
                      admin:
                        type: object
                        properties:
                          uuid:
                            type: string
                            example: 01a1451b-02d3-7338-8684-7ea8ba3bb976
                          name:
                            type: string
                            example: 'Mrs. Freida Hettinger DVM'
                          email:
                            type: string
                            example: rachel.wunsch@apfspn.test
                          status:
                            type: string
                            example: active
                          account_state:
                            type: string
                            example: active
                          must_reset_password:
                            type: boolean
                            example: false
                          last_login_at:
                            type: string
                            example: '2026-10-16T14:26:00+00:00'
                          roles:
                            type: array
                            example:
                              - events_coordinator
                            items:
                              type: string
                          permissions:
                            type: array
                            example:
                              - dashboard.view
                              - event_registrations.export
                              - event_registrations.update
                            items:
                              type: string
                          created_at:
                            type: string
                            example: '2026-10-16T14:26:00+00:00'
        403:
          description: 'Failure (Forbidden)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'This account has been disabled.'
                  data:
                    code: account_disabled
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'This account has been disabled.'
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: account_disabled
      tags:
        - 'Admin Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: rachel.wunsch@apfspn.test
                client:
                  type: string
                  description: ''
                  example: web
                  enum:
                    - web
                    - mobile
                password:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: Password123
              required:
                - email
                - client
                - password
      security: []
  /api/v1/admin/auth/verify-otp:
    post:
      summary: 'Login: verify OTP'
      operationId: loginVerifyOTP
      description: "**Rate limit:** `otp`.\n\nUse after Login when next_step is verify_otp (APFSPN_ADMIN_TWO_FACTOR on). Sends the login challenge and the emailed code; returns tokens, saved to admin_token and admin_refresh_token. The same URL also verifies reset codes: see \"Forgot password: verify OTP\". Errors: invalid_otp, otp_expired, stale_challenge_token, otp_blocked, invalid_challenge_token."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'Code verified.'
                  data:
                    next_step: authenticated
                    tokens:
                      access_token: '{access_token}'
                      refresh_token: '{refresh_token}'
                      token_type: Bearer
                      expires_in: 3600
                      refresh_expires_in: 2592000
                    admin:
                      uuid: 01a1451b-3d79-720d-953d-98b24cb2f2eb
                      name: 'Ms. Calista Dietrich PhD'
                      email: tyree.gottlieb@apfspn.test
                      status: active
                      account_state: active
                      must_reset_password: false
                      last_login_at: '2026-10-16T14:26:15+00:00'
                      roles:
                        - super_admin
                      permissions:
                        - admins.create
                        - admins.delete
                        - admins.update
                      created_at: '2026-10-16T14:26:15+00:00'
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Code verified.'
                  data:
                    type: object
                    properties:
                      next_step:
                        type: string
                        example: authenticated
                      tokens:
                        type: object
                        properties:
                          access_token:
                            type: string
                            example: '{access_token}'
                          refresh_token:
                            type: string
                            example: '{refresh_token}'
                          token_type:
                            type: string
                            example: Bearer
                          expires_in:
                            type: integer
                            example: 3600
                          refresh_expires_in:
                            type: integer
                            example: 2592000
                      admin:
                        type: object
                        properties:
                          uuid:
                            type: string
                            example: 01a1451b-3d79-720d-953d-98b24cb2f2eb
                          name:
                            type: string
                            example: 'Ms. Calista Dietrich PhD'
                          email:
                            type: string
                            example: tyree.gottlieb@apfspn.test
                          status:
                            type: string
                            example: active
                          account_state:
                            type: string
                            example: active
                          must_reset_password:
                            type: boolean
                            example: false
                          last_login_at:
                            type: string
                            example: '2026-10-16T14:26:15+00:00'
                          roles:
                            type: array
                            example:
                              - super_admin
                            items:
                              type: string
                          permissions:
                            type: array
                            example:
                              - admins.create
                              - admins.delete
                              - admins.update
                            items:
                              type: string
                          created_at:
                            type: string
                            example: '2026-10-16T14:26:15+00:00'
        422:
          description: 'Failure (Unprocessable Content)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'The code you entered is incorrect.'
                  data:
                    code: invalid_otp
                    attempts_remaining: 4
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'The code you entered is incorrect.'
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: invalid_otp
                      attempts_remaining:
                        type: integer
                        example: 4
      tags:
        - 'Admin Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  description: 'Must not be greater than 2048 characters.'
                  example: '{challenge_token}'
                code:
                  type: string
                  description: 'Must be 6 digits.'
                  example: '084422'
                client:
                  type: string
                  description: ''
                  example: web
                  enum:
                    - web
                    - mobile
              required:
                - challenge_token
                - code
                - client
      security: []
  /api/v1/admin/auth/resend-otp:
    post:
      summary: 'Resend OTP'
      operationId: resendOTP
      description: "**Rate limit:** `otp`.\n\nmode is send_new (new code and new challenge token), reuse (still in cooldown), or a 429 otp_blocked."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'If the code was due, a new one has been sent.'
                  data:
                    challenge_token: '{challenge_token}'
                    mode: send_new
                    expires_in: 599
                    retry_after_seconds: 60
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'If the code was due, a new one has been sent.'
                  data:
                    type: object
                    properties:
                      challenge_token:
                        type: string
                        example: '{challenge_token}'
                      mode:
                        type: string
                        example: send_new
                      expires_in:
                        type: integer
                        example: 599
                      retry_after_seconds:
                        type: integer
                        example: 60
        422:
          description: 'Failure (Unprocessable Content)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'The challenge token field is required.'
                  data:
                    challenge_token:
                      - '{challenge_token}'
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'The challenge token field is required.'
                  data:
                    type: object
                    properties:
                      challenge_token:
                        type: array
                        example:
                          - '{challenge_token}'
                        items:
                          type: string
      tags:
        - 'Admin Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  description: 'Must not be greater than 2048 characters.'
                  example: '{challenge_token}'
              required:
                - challenge_token
      security: []
  /api/v1/admin/auth/forgot-password:
    post:
      summary: 'Forgot Password'
      operationId: forgotPassword
      description: "**Rate limit:** `reset`.\n\nAlways returns a challenge, even for unknown emails. The OTP is emailed only for real accounts."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'If an account exists for this email, a reset code has been sent.'
                  data:
                    challenge_token: '{challenge_token}'
                    mode: send_new
                    expires_in: 599
                    retry_after_seconds: 60
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'If an account exists for this email, a reset code has been sent.'
                  data:
                    type: object
                    properties:
                      challenge_token:
                        type: string
                        example: '{challenge_token}'
                      mode:
                        type: string
                        example: send_new
                      expires_in:
                        type: integer
                        example: 599
                      retry_after_seconds:
                        type: integer
                        example: 60
        422:
          description: 'Failure (Unprocessable Content)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'The email field must be a valid email address.'
                  data:
                    email:
                      - 'The email field must be a valid email address.'
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'The email field must be a valid email address.'
                  data:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field must be a valid email address.'
                        items:
                          type: string
      tags:
        - 'Admin Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: loy24@apfspn.test
              required:
                - email
      security: []
  /api/v1/admin/auth/reset-password:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: "**Rate limit:** `reset`.\n\nUses the reset_token from Verify OTP, or the token from an invite link. Clears must_reset_password and revokes all sessions. Error: invalid_reset_token."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'Your password has been reset. Please sign in.'
                  data: null
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Your password has been reset. Please sign in.'
                  data:
                    type: string
                    example: null
                    nullable: true
        422:
          description: 'Failure (Unprocessable Content)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'This password reset link is invalid or has expired.'
                  data:
                    code: invalid_reset_token
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'This password reset link is invalid or has expired.'
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: invalid_reset_token
      tags:
        - 'Admin Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: ''
                  example: BrandNewPass1
                reset_token:
                  type: string
                  description: 'Must not be greater than 2048 characters.'
                  example: '{reset_token}'
              required:
                - password
                - reset_token
      security: []
  /api/v1/admin/auth/refresh:
    post:
      summary: Refresh
      operationId: refresh
      description: "**Rate limit:** `refresh`.\n\n**Auth:** admin refresh token sent as the bearer token.\n\nSend the refresh token as the bearer. Rotates both tokens. Errors: refresh_token_required, wrong_audience, must_reset_password."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'Tokens refreshed.'
                  data:
                    access_token: '{access_token}'
                    refresh_token: '{refresh_token}'
                    token_type: Bearer
                    expires_in: 3600
                    refresh_expires_in: 2592000
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Tokens refreshed.'
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: '{access_token}'
                      refresh_token:
                        type: string
                        example: '{refresh_token}'
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 3600
                      refresh_expires_in:
                        type: integer
                        example: 2592000
        403:
          description: 'Failure (Forbidden)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'This account has been disabled.'
                  data:
                    code: account_disabled
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'This account has been disabled.'
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: account_disabled
      tags:
        - 'Admin Auth'
  /api/v1/admin/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: "**Auth:** admin access token.\n\nRevokes the current session (access and refresh token) and clears the saved tokens."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'Logged out.'
                  data: null
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Logged out.'
                  data:
                    type: string
                    example: null
                    nullable: true
        401:
          description: 'Failure (Unauthorized)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: Unauthenticated.
                  data: null
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Unauthenticated.
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'Admin Auth'
  /api/v1/admin/auth/me:
    get:
      summary: Me
      operationId: me
      description: "**Auth:** admin access token.\n\nReturns the admin with roles and permissions."
      parameters: []
      responses:
        200:
          description: 'Success (OK)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: false
                  message: 'Request successful.'
                  data:
                    uuid: 01a1451b-4572-717d-a29a-a24f445d634b
                    name: 'Miss Brigitte Dare DDS'
                    email: tyrel.metz@apfspn.test
                    status: active
                    account_state: active
                    must_reset_password: false
                    last_login_at: '2026-10-16T14:26:17+00:00'
                    roles:
                      - super_admin
                    permissions:
                      - admins.create
                      - admins.delete
                      - admins.update
                    created_at: '2026-10-16T14:26:17+00:00'
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Request successful.'
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 01a1451b-4572-717d-a29a-a24f445d634b
                      name:
                        type: string
                        example: 'Miss Brigitte Dare DDS'
                      email:
                        type: string
                        example: tyrel.metz@apfspn.test
                      status:
                        type: string
                        example: active
                      account_state:
                        type: string
                        example: active
                      must_reset_password:
                        type: boolean
                        example: false
                      last_login_at:
                        type: string
                        example: '2026-10-16T14:26:17+00:00'
                      roles:
                        type: array
                        example:
                          - super_admin
                        items:
                          type: string
                      permissions:
                        type: array
                        example:
                          - admins.create
                          - admins.delete
                          - admins.update
                        items:
                          type: string
                      created_at:
                        type: string
                        example: '2026-10-16T14:26:17+00:00'
        403:
          description: 'Failure (Forbidden)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error: true
                  message: 'This account has been disabled.'
                  data:
                    code: account_disabled
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'This account has been disabled.'
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: account_disabled
      tags:
        - 'Admin Auth'
  /api/v1/admin/dashboard:
    get:
      summary: Dashboard
      operationId: dashboard
